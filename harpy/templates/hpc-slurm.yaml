executor: slurm
default-resources:
  mem_mb: attempt * 2000
  runtime: 10
slurm-account: $USER
slurm-partition: regular
slurm-jobname-prefix: harpy
slurm-status-command: squeue
jobs: 50
latency-wait: 60
retries: 1

